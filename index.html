<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CTOSM - Controle de Estoque</title>
</head>
<body>

<div id="ctosm-loader" style="
  font-family:Arial,sans-serif;
  display:flex;
  align-items:center;
  justify-content:center;
  min-height:100vh;
  background:#f2f3f0;
  color:#1b2430;
  font-size:18px;
">
  Carregando CTOSM...
</div>

<script>
(async function () {
  'use strict';

  try {

    const resposta = await fetch(
      'index_backup.html?v=' + Date.now(),
      { cache: 'no-store' }
    );

    if (!resposta.ok) {
      throw new Error(
        'Não foi possível carregar index_backup.html (' +
        resposta.status + ')'
      );
    }

    let html = await resposta.text();

    /*
     * =========================================================
     * INTEGRAÇÃO SUPABASE
     * =========================================================
     */

    const supabaseBridge = `
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"><\\/script>
<script src="supabase-config.js"><\\/script>

<script>
(function () {
  'use strict';

  if (!window.supabase) {
    console.error('CTOSM: biblioteca Supabase não carregou.');
    return;
  }

  if (!window.CTOSM_SUPABASE_CONFIG) {
    console.error('CTOSM: supabase-config.js não encontrado.');
    return;
  }

  const SB = window.supabase.createClient(
    window.CTOSM_SUPABASE_CONFIG.url,
    window.CTOSM_SUPABASE_CONFIG.key
  );

  window.CTOSM_SUPABASE = SB;

  /*
   * ---------------------------------------------------------
   * Compatibilidade com o sistema antigo.
   * O código original usa window.storage.
   * Agora ele passa a usar o Supabase.
   * ---------------------------------------------------------
   */

  window.storage = {

    async get(key, shared) {

      if (!shared) {
        const value = localStorage.getItem(key);

        if (value === null) {
          return null;
        }

        return { value: value };
      }

      const result = await SB
        .from('ctosm_store')
        .select('payload')
        .eq('chave', key)
        .maybeSingle();

      if (result.error) {
        console.error(
          'CTOSM GET:',
          result.error
        );
        throw result.error;
      }

      if (!result.data) {
        return null;
      }

      return {
        value: JSON.stringify(result.data.payload)
      };
    },

    async set(key, value, shared) {

      if (!shared) {
        localStorage.setItem(key, value);
        return { ok: true };
      }

      let payload;

      try {
        payload = JSON.parse(value);
      } catch (erro) {
        payload = value;
      }

      const tipo = String(key).split(':')[0];

      const result = await SB
        .from('ctosm_store')
        .upsert(
          {
            chave: key,
            tipo: tipo,
            payload: payload,
            atualizado_em: new Date().toISOString()
          },
          {
            onConflict: 'chave'
          }
        );

      if (result.error) {
        console.error(
          'CTOSM SET:',
          result.error
        );
        throw result.error;
      }

      return {
        ok: true
      };
    },

    async delete(key, shared) {

      if (!shared) {
        localStorage.removeItem(key);
        return { ok: true };
      }

      const result = await SB
        .from('ctosm_store')
        .delete()
        .eq('chave', key);

      if (result.error) {
        console.error(
          'CTOSM DELETE:',
          result.error
        );
        throw result.error;
      }

      return {
        ok: true
      };
    },

    async list(prefix, shared) {

      if (!shared) {

        const keys = [];

        for (
          let i = 0;
          i < localStorage.length;
          i++
        ) {
          const key =
            localStorage.key(i);

          if (
            key &&
            key.startsWith(prefix)
          ) {
            keys.push(key);
          }
        }

        return {
          keys: keys
        };
      }

      const result = await SB
        .from('ctosm_store')
        .select('chave')
        .like(
          'chave',
          String(prefix) + '%'
        )
        .order('chave');

      if (result.error) {
        console.error(
          'CTOSM LIST:',
          result.error
        );
        throw result.error;
      }

      return {
        keys: (result.data || [])
          .map(function (item) {
            return item.chave;
          })
      };
    }
  };

  console.log(
    'CTOSM: integração Supabase ativa.'
  );
})();
<\\/script>
`;

    /*
     * Coloca a conexão antes dos scripts
     * originais do sistema.
     */

    html = html.replace(
      /<\\/head>/i,
      supabaseBridge + '</head>'
    );


    /*
     * =========================================================
     * NOVO IMPORTADOR ONLINE
     * =========================================================
     */

    const importadorOnline = `
<script>
(function () {
  'use strict';

  function iniciarImportadorOnline() {

    const input =
      document.getElementById('v2-import-file');

    if (!input) {
      return;
    }

    input.onchange = async function (e) {

      const file =
        e.target.files &&
        e.target.files[0];

      if (!file) {
        return;
      }

      try {

        const data =
          JSON.parse(
            await file.text()
          );

        const materiaisImportados =
          Array.isArray(data.materiais)
            ? data.materiais
            : [];

        const movimentacoesImportadas =
          Array.isArray(data.movimentacoes)
            ? data.movimentacoes
            : [];

        const maquinariosImportados =
          Array.isArray(data.maq)
            ? data.maq
            : [];

        const maqMovsImportados =
          Array.isArray(data.maqMovs)
            ? data.maqMovs
            : [];

        const atendimentosImportados =
          Array.isArray(data.atendimentos)
            ? data.atendimentos
            : [];

        const total =
          materiaisImportados.length +
          movimentacoesImportadas.length +
          maquinariosImportados.length +
          maqMovsImportados.length +
          atendimentosImportados.length;

        if (!total) {
          alert(
            'O arquivo não possui registros.'
          );
          return;
        }

        const confirmar =
          confirm(
            'Importar backup para o banco online?\\n\\n' +
            'Materiais: ' +
            materiaisImportados.length +
            '\\nMovimentações: ' +
            movimentacoesImportadas.length +
            '\\nAtendimentos: ' +
            atendimentosImportados.length
          );

        if (!confirmar) {
          return;
        }

        function pausa(ms) {
          return new Promise(
            function (resolve) {
              setTimeout(
                resolve,
                ms
              );
            }
          );
        }

        async function salvarLista(
          lista,
          prefixo
        ) {

          for (
            let i = 0;
            i < lista.length;
            i++
          ) {

            const item =
              lista[i];

            await window.storage.set(
              prefixo + ':' + item.id,
              JSON.stringify(item),
              true
            );

            if (
              i % 5 === 4
            ) {
              await pausa(150);
            }
          }
        }

        if (
          typeof window.showToast ===
          'function'
        ) {
          window.showToast(
            'Gravando materiais...',
            5000
          );
        }

        await salvarLista(
          materiaisImportados,
          'material'
        );

        if (
          typeof window.showToast ===
          'function'
        ) {
          window.showToast(
            'Gravando movimentações...',
            5000
          );
        }

        await salvarLista(
          movimentacoesImportadas,
          'mov'
        );

        await salvarLista(
          maquinariosImportados,
          'maquinario'
        );

        await salvarLista(
          maqMovsImportados,
          'maqmov'
        );

        await salvarLista(
          atendimentosImportados,
          'atendimento'
        );

        /*
         * Atualiza as variáveis do sistema.
         * Como são bindings globais do HTML original,
         * fazemos isso somente quando elas existem.
         */

        try {
          materiais =
            materiaisImportados;

          movimentacoes =
            movimentacoesImportadas;

          maquinarios =
            maquinariosImportados;

          maqMovs =
            maqMovsImportados;

          atendimentos =
            atendimentosImportados;
        } catch (erro) {
          console.warn(
            'CTOSM: atualização de memória:',
            erro
          );
        }

        if (
          typeof window.render ===
          'function'
        ) {
          window.render();
        }

        if (
          typeof window.refreshV2 ===
          'function'
        ) {
          window.refreshV2();
        }

        alert(
          'BACKUP IMPORTADO COM SUCESSO!\\n\\n' +
          'Materiais: ' +
          materiaisImportados.length +
          '\\n' +
          'Movimentações: ' +
          movimentacoesImportadas.length +
          '\\n' +
          'Atendimentos: ' +
          atendimentosImportados.length +
          '\\n\\n' +
          'Os dados foram gravados no Supabase.'
        );

      } catch (erro) {

        console.error(
          'CTOSM - erro de importação:',
          erro
        );

        alert(
          'ERRO AO IMPORTAR O BACKUP:\\n\\n' +
          (erro.message || erro)
        );

      } finally {

        e.target.value = '';

      }
    };
  }

  /*
   * Aguarda o HTML original terminar
   * de construir a interface.
   */

  if (
    document.readyState ===
    'loading'
  ) {

    document.addEventListener(
      'DOMContentLoaded',
      function () {
        setTimeout(
          iniciarImportadorOnline,
          1000
        );
      }
    );

  } else {

    setTimeout(
      iniciarImportadorOnline,
      1000
    );

  }

})();
<\\/script>
`;

    /*
     * Coloca o novo importador no final.
     */

    html = html.replace(
      /<\\/body>/i,
      importadorOnline + '</body>'
    );


    /*
     * =========================================================
     * REALTIME
     * =========================================================
     */

    const realtime = `
<script>
(function () {

  function iniciarRealtime() {

    if (
      !window.CTOSM_SUPABASE
    ) {
      return;
    }

    try {

      window.CTOSM_SUPABASE
        .channel('ctosm-realtime')
        .on(
          'postgres_changes',
          {
            event: '*',
            schema: 'public',
            table: 'ctosm_store'
          },
          async function () {

            try {

              if (
                typeof loadData ===
                'function'
              ) {

                await loadData();

              }

              if (
                typeof updateHeaderMeta ===
                'function'
              ) {

                updateHeaderMeta();

              }

              if (
                typeof render ===
                'function'
              ) {

                render();

              }

            } catch (erro) {

              console.error(
                'CTOSM Realtime:',
                erro
              );

            }

          }
        )
        .subscribe();

    } catch (erro) {

      console.error(
        'CTOSM Realtime:',
        erro
      );

    }

  }

  setTimeout(
    iniciarRealtime,
    2500
  );

})();
<\\/script>
`;

    html = html.replace(
      /<\\/body>/i,
      realtime + '</body>'
    );


    /*
     * =========================================================
     * SUBSTITUI A PÁGINA ATUAL PELA ORIGINAL
     * JÁ CORRIGIDA.
     * =========================================================
     */

    document.open();
    document.write(html);
    document.close();

  } catch (erro) {

    document.body.innerHTML = '';

    const caixa =
      document.createElement('div');

    caixa.style.cssText =
      'font-family:Arial;padding:40px;color:#9b342c;background:#fff;';

    caixa.innerHTML =
      '<h2>Erro ao carregar o CTOSM</h2>' +
      '<p>' +
      (erro.message || erro) +
      '</p>' +
      '<p>' +
      'Verifique se o arquivo index_backup.html está no mesmo repositório.' +
      '</p>';

    document.body.appendChild(caixa);

    console.error(
      'CTOSM Loader:',
      erro
    );
  }

})();
</script>

</body>
</html>
